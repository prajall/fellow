<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {% load static %}
    <link rel="stylesheet" href="{% static 'blog/style.css' %}" />

    <title>{% block title %} My Blog Application {% endblock %}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <h1 class="p-10 bg-slate-50 text-4xl text-center font-bold">GOLB Blog</h1>
    <div class="container px-4 md:px-10 xl:px-20">
      {% block content %} {% endblock %}
    </div>
  </body>
</html>
